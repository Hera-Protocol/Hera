[package]
name = "hera-sdk-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wasm-bindgen bridge for the Hera privacy compliance SDK"
repository = "https://github.com/Hera-Protocol/Hera"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
hera-sdk-core = { path = "../sdk-core" }
hera-types = { path = "../../crates/hera-types" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
