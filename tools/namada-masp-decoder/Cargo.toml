[package]
name = "namada-masp-decoder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
hera-namada-adapter = { path = "../../crates/hera-namada-adapter" }
hera-types = { path = "../../crates/hera-types" }
serde_json = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "io-util"] }
