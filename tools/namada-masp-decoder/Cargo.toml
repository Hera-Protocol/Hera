[package]
name = "namada-masp-decoder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
borsh = "1.5"
chrono = { version = "0.4", features = ["serde", "clock"] }
hera-namada-adapter = { path = "../../crates/hera-namada-adapter" }
hera-types = { path = "../../crates/hera-types" }
hex = "0.4"
kdam = "0.6"
masp_primitives = "3.0.11"
namada_core = "0.251.4"
namada_sdk = "0.251.4"
namada_tx = "0.251.4"
reqwest = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "io-util"] }
