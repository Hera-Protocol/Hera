[package]
name = "hera-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# This crate exposes worker internals to sibling crates and tests, not as a
# public documentation surface, so doctests provide little value here.
doctest = false

[dependencies]
anyhow.workspace = true
ark-bls12-381.workspace = true
ark-std.workspace = true
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
chrono.workspace = true
deadpool-redis = "0.18"
ed25519-dalek = "2.1"
hera-core = { path = "../../crates/hera-core" }
hera-crypto = { path = "../../crates/hera-crypto" }
hera-db = { path = "../../crates/hera-db" }
hera-namada-adapter = { path = "../../crates/hera-namada-adapter" }
hera-proof-circuits = { path = "../../crates/hera-proof-circuits" }
hera-proof-witness = { path = "../../crates/hera-proof-witness" }
hera-reporter = { path = "../reporter" }
hera-types = { path = "../../crates/hera-types" }
hera-zcash-adapter = { path = "../../crates/hera-zcash-adapter" }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid.workspace = true
