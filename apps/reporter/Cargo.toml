[package]
name = "hera-reporter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Reporter is consumed by services and integration tests. We keep coverage in
# unit and integration tests rather than rustdoc snippets.
doctest = false

[dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
chrono.workspace = true
ed25519-dalek = "2.1"
hex = "0.4"
hera-crypto = { path = "../../crates/hera-crypto" }
hera-db = { path = "../../crates/hera-db" }
hera-types = { path = "../../crates/hera-types" }
printpdf = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true
tokio.workspace = true
