[workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/reporter",
    "crates/hera-types",
    "crates/hera-core",
    "crates/hera-crypto",
    "crates/hera-db",
    "crates/hera-zcash-adapter",
    "crates/hera-namada-adapter",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
tracing = "0.1"
uuid = { version = "1.8", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1.0"
anyhow = "1.0"
