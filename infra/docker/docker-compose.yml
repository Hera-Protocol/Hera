# Hera Stage 1 runs on a single bridge network so local services can resolve
# each other by name without leaking ports beyond the development machine.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hera-postgres
    ports:
      # Expose Postgres on the default port so app env vars match production-style URLs.
      - "5432:5432"
    environment:
      # Fixed credentials keep local onboarding deterministic and match the root env template.
      POSTGRES_DB: hera
      POSTGRES_USER: hera
      POSTGRES_PASSWORD: devpassword
    volumes:
      # Persist database state across container restarts so developers do not lose cases and migrations on every reboot.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hera -d hera"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hera-net

  redis:
    image: redis:7-alpine
    container_name: hera-redis
    ports:
      # Expose Redis on its standard port so workers and the API can share the same local queue URL.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hera-net

  localstack:
    # Pin the LocalStack image so development and CI do not silently inherit
    # breaking behavior changes from the floating latest tag.
    image: localstack/localstack:4.12.0
    container_name: hera-localstack
    ports:
      # LocalStack emulates AWS APIs locally so S3 and KMS flows can be exercised without real cloud credentials.
      - "4566:4566"
    environment:
      # Restrict LocalStack to the AWS services Hera Stage 1 actually needs to keep startup lighter and intent explicit.
      SERVICES: s3,kms
      # Newer LocalStack images default toward Pro activation. We force community-mode behavior in development so tests do not require a paid auth token.
      ACTIVATE_PRO: "0"
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      # Persist LocalStack state so buckets and KMS aliases survive routine restarts during development.
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - hera-net

networks:
  hera-net:
    driver: bridge

volumes:
  postgres-data:
  localstack-data:
